<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 500 - error del servidor</title>
    <link rel="stylesheet" href="Estilos.css">
</head>
<body>
    
    <header class="header">
        <div class="logo">
            ZaffApp
        </div>
    </header>

   
    <main class="error-page">

        <div class="marca-de-agua"></div>
        <div class="Contenido"></div>
        <h1 class="error-code">500</h1>

        
        <h2 class="Notificacion">
            ¡Ups! algo salió mal
        </h2>

        
        <p>
            Ocurrió un error inesperado en el servidor.
            Inténtalo nuevamente más tarde.
        </p>

       
        <div class="acciones">

            <a href="/" class="btn-primaro">
                Volver al inicio
            </a>
            </div>

            <button onclick="location.reload()" class="btn-secundario">
                Intentar nuevamente
            </button>

        </div>

    </main>
</body>
</html>
