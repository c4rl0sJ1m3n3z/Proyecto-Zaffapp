<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaffapp - Iniciar Sesión</title>
    <!-- Mismas fuentes e iconos que la plataforma principal -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-container">
        <div class="auth-card">
            
            <!-- Logo Zaffapp -->
            <div class="logo-container">
                <img src="logo.png" alt="Logo Zaffapp" class="logo-img">
                <span class="logo-text">ZaffApp</span>
            </div>

            <!-- Encabezado -->
            <div class="auth-header">
                <h2>Bienvenido</h2>
                <p>Inicia sesión para continuar</p>
            </div>

            <!-- Formulario de acceso -->
            <form class="auth-form">
                <div class="input-field">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="text" placeholder="Correo electrónico / Teléfono" required>
                </div>

                <div class="input-field">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" placeholder="Contraseña" required>
                    <i class="fas fa-eye-slash toggle-password"></i>
                </div>

                <!-- Pestañas / Alternador -->
                <div class="auth-tabs">
                    <a href="#" class="tab-link active">Iniciar sesión</a>
                    <a href="#" class="tab-link">Registrarse</a>
                </div>

                <!-- Botón Principal -->
                <button type="submit" class="btn btn-primary">Iniciar sesión</button>
            </form>

            <!-- Separador -->
            <div class="divider">
                <span>o</span>
            </div>

            <!-- Botón Social -->
            <button type="button" class="btn btn-google">
                <i class="fab fa-google"></i> Continuar con Google
            </button>

            <!-- Recuperación de clave -->
            <div class="auth-footer">
                <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

        </div>
    </main>

</body>
</html>
