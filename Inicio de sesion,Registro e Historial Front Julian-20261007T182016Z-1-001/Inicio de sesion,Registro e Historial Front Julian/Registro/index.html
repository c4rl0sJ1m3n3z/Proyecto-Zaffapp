<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaffapp - Registro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="registro.css">
</head>
<body>

    <main class="auth-container">
        <div class="auth-card">
            
            <!-- Botón de regresar -->
            <div class="card-top-bar">
                <a href="../Inicio sesion/index.html" class="back-btn" title="Volver al inicio de sesión">
                    <i class="fas fa-chevron-left"></i>
                </a>
            </div>

            <!-- Avatar superior -->
            <div class="auth-avatar">
                <i class="fas fa-user"></i>
            </div>

            <!-- Encabezado -->
            <div class="auth-header">
                <h2>Registro</h2>
                <p>Crea tu cuenta</p>
            </div>

            <!-- Formulario de Registro -->
            <form class="auth-form">
                
                <div class="input-field">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" placeholder="Nombre de usuario" required>
                </div>

                <div class="input-field">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" placeholder="Correo electrónico" required>
                </div>

                <div class="input-field">
                    <i class="fas fa-id-card input-icon"></i>
                    <input type="text" placeholder="N. Identificación" required>
                </div>

                <div class="input-field">
                    <i class="fas fa-phone input-icon"></i>
                    <input type="tel" placeholder="N. Teléfono" required>
                </div>

                <div class="input-field">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" placeholder="Contraseña" required>
                    <i class="fas fa-eye-slash toggle-password"></i>
                </div>

                <!-- Botón de Registro -->
                <button type="submit" class="btn btn-primary">Registrarse</button>
            </form>

            <!-- Pie con enlace a Login -->
            <div class="auth-footer">
                <span>¿Ya tienes cuenta?</span>
                <a href="../Inicio sesion/index.html" class="auth-link">Iniciar sesión</a>
            </div>

        </div>
    </main>

</body>
</html>
